name: Scheduled Health Check

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  health_check_job:
    runs-on: ubuntu-24.04
    name: Check all sites

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Health Check
        run: bash ./health-check.sh
